[project]
name = "safejsa"
version = "0.1.0"
description = "Local AI reviewer for offshore job safety analyses, grounded in BSEE Safety Alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "mcp>=1.24,<2",
    "pydantic>=2.7",
    "pypdf>=7.0.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
]

[project.scripts]
safejsa = "safejsa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
